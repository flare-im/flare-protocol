syntax = "proto3";

package flare.common.v1;

import "data.proto";
import "event.proto";
import "errors.proto";
import "message.proto";
import "conversation.proto";

// MQ 信封。主 Topic 分区键 conversation_id；payload 为 Message 或 Event；trace/tenant 走 MQ 头或 Ctx。

enum MqPayloadKind {
  MQ_PAYLOAD_KIND_UNSPECIFIED = 0;
  MQ_PAYLOAD_KIND_MESSAGE = 1;
  MQ_PAYLOAD_KIND_EVENT = 2;
}

/// 主 MQ 记录：`Message` 或 `Event`（由 oneof 保证单选）；含接收者用户 ID 列表。
message MqEnvelope {
  string envelope_id = 1;
  repeated string recipient_user_ids = 2;
  string conversation_id = 3;
  uint64 seq = 4;
  int64 produced_at = 5;
  MqPayloadKind payload_kind = 6;
  map<string, string> headers = 7;

  // 推送/持久化标记
  bool push_only = 8;           // 仅推送，不持久化（临时消息）
  bool persistence_only = 9;    // 仅持久化，不推送（如已读回执）

  oneof payload {
    Message message = 10;
    Event event = 11;
  }

  // 大群主链路信号：true 时 recipient_user_ids 必须为空，推送侧走 per-conversation online index。
  bool large_conversation = 12;
}

enum PushTaskPayloadKind {
  PUSH_TASK_PAYLOAD_KIND_UNSPECIFIED = 0;
  PUSH_TASK_PAYLOAD_KIND_MESSAGE = 1;
  PUSH_TASK_PAYLOAD_KIND_EVENT = 2;
  PUSH_TASK_PAYLOAD_KIND_NOTIFICATION = 3;
  PUSH_TASK_PAYLOAD_KIND_ACK = 4;
  PUSH_TASK_PAYLOAD_KIND_CUSTOM = 5;
  // Online only: AccessGateway PushCapability (DataPacket.capability), never an offline task.
  PUSH_TASK_PAYLOAD_KIND_CAPABILITY = 6;
}

// 提示等级：一条消息或事件值不值得打扰接收者。由服务端分类器给出。
enum AlertClass {
  ALERT_CLASS_UNSPECIFIED = 0;
  ALERT_CLASS_NONE = 1;     // 不提示、不计数：已读回执、输入中、表情回应、编辑
  ALERT_CLASS_SILENT = 2;   // 更新通知内容与角标，不响铃
  ALERT_CLASS_NORMAL = 3;   // 普通消息
  ALERT_CLASS_MENTION = 4;  // 点名到接收者，或 @所有人
  ALERT_CLASS_URGENT = 5;   // 绕过免打扰与预算，受发送方配额限制
}

// 推送处置：这条离线任务在设备上要产生什么效果。
enum PushDisposition {
  PUSH_DISPOSITION_UNSPECIFIED = 0;
  PUSH_DISPOSITION_LOUD = 1;            // 展示并响铃
  PUSH_DISPOSITION_QUIET = 2;           // 覆盖同一合并键的通知，不响铃
  PUSH_DISPOSITION_CLEAR = 3;           // 清除同一合并键的通知
  PUSH_DISPOSITION_BADGE_ONLY = 4;      // 只更新角标
  PUSH_DISPOSITION_RECALL_REPLACE = 5;  // 用撤回文案覆盖同一合并键的通知，不响铃
  PUSH_DISPOSITION_DIGEST = 6;          // 摘要通知
}

message PushTaskEnvelope {
  string user_id = 1;
  string message_id = 2;
  string conversation_id = 3;
  string tenant_id = 4;
  int32 priority = 5;
  optional int64 expire_at = 6;
  bytes push_payload = 7;
  map<string, string> headers = 8;
  PushTaskPayloadKind payload_kind = 9;

  // 以下字段只有离线任务填写；在线任务（按会话或按用户广播）保持为空。
  string device_id = 10;             // 目标设备：离线任务按设备发，只投给这台设备的推送绑定
  string collapse_key = 11;          // 合并键：同一键的通知在设备上互相覆盖（一个会话一条）
  string thread_key = 12;            // 分组键：系统通知中心按它归组
  PushDisposition disposition = 13;
  AlertClass alert_class = 14;
  uint32 count = 15;                 // 这条通知代表的未读条数；0 与 1 都表示单条
  optional uint32 badge = 16;        // 角标绝对值；缺省表示不改角标
  uint64 conversation_seq = 17;      // 所代表的最新消息的会话 seq；端上只接受更大的值
  string idempotency_key = 18;       // 稳定的幂等键，同时作为 broker 的消息标识
  NotificationPreview preview = 19;  // 接收者的通知预览设置，worker 据此决定文案露出多少
  uint32 digest_conversations = 20;  // 摘要通知代表的会话数（disposition 为 DIGEST 时）
}

// 设备交接：一台设备从「链路负责提示」转为「推送通道负责提示」。
enum DeviceHandoffCause {
  DEVICE_HANDOFF_CAUSE_UNSPECIFIED = 0;
  DEVICE_HANDOFF_CAUSE_PARKED = 1;        // 客户端主动托管；确认之后才到的帧列在 pending 里
  DEVICE_HANDOFF_CAUSE_ACK_TIMEOUT = 2;   // 送达确认超时，或连接已被标为可疑
  DEVICE_HANDOFF_CAUSE_LINK_LOST = 3;     // 连接断开时仍有未确认的帧
  DEVICE_HANDOFF_CAUSE_GATEWAY_LOST = 4;  // 网关失联，pending 为空，由 since 起的变更决定补提示范围
}

message DeviceHandoffItem {
  string conversation_id = 1;
  uint64 seq = 2;          // 会话 seq
  string message_id = 3;   // 服务端消息 ID
}

// 发布到 flare.im.push.handoff，分区键为 user_id。push-server 据此对 pending 做一次补提示：
// 按会话合并，每个会话取最新一条渲染，走与正常离线推送相同的偏好过滤。
message DeviceHandoff {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string connection_id = 4;
  string gateway_id = 5;
  DeviceHandoffCause cause = 6;
  int64 since = 7;          // GATEWAY_LOST：网关租约最后可见时间，Unix epoch millis
  int64 occurred_at = 8;    // Unix epoch millis
  repeated DeviceHandoffItem pending = 9;
}

// Versioned, authenticated broker record. This is a NEW wire format: never put it
// on a topic while a legacy MqEnvelope/PushEnvelope/PushTaskEnvelope consumer is
// still subscribed. The inner payload is kept byte-for-byte; no protobuf map is
// re-encoded when calculating its digest or signature. The outer v1 wrapper
// must use one occurrence per known tag, ascending tag order, minimal varints,
// and no unknown fields; verifiers reject non-canonical encodings.
message SignedPushRecordV1 {
  uint32 version = 1;                 // Must be exactly 1.
  string logical_topic = 2;          // Exact broker topic/subject, not a wildcard.
  string logical_key = 3;            // Exact broker publish key; required.
  string tenant_id = 4;
  string producer_id = 5;            // Authorized workload identity.
  string key_id = 6;                 // Producer-scoped Ed25519 public key ID.
  string event_id = 7;               // Stable idempotency identity.
  string payload_schema = 8;         // Exact inner Protobuf schema identifier.
  bytes payload_sha256 = 9;          // SHA-256 of the original payload bytes.
  int64 issued_at = 10;              // Unix epoch milliseconds.
  int64 expires_at = 11;             // Unix epoch milliseconds.
  string source_event_id = 12;       // Nonempty for a derived record.
  bytes payload = 13;                // Original inner bytes; never re-encode to verify.
  bytes signature = 14;              // Ed25519 over the v1 domain-separated frame.
}

message ConversationUpdateEnvelope {
  string user_id = 1;
  string conversation_id = 2;
  string tenant_id = 3;
  string update_type = 4;
  uint64 max_seq = 5;
  uint64 last_read_seq = 6;
  bytes summary_snapshot = 7;
  map<string, string> attributes = 8;
  int64 updated_at = 9;
}

// PushEnvelope：ACK/通知/自定义/系统消息/插件实时包，经 MQ 到 Push Server，不落库。

enum PushTargetType {
  PUSH_TARGET_TYPE_UNSPECIFIED = 0;
  PUSH_TARGET_TYPE_ALL = 1;          // 全量推送（所有在线设备）
  PUSH_TARGET_TYPE_USERS = 2;        // 指定用户列表
  PUSH_TARGET_TYPE_DEVICES = 3;      // 指定设备列表
}

// 推送载荷类型
enum PushPayloadKind {
  PUSH_PAYLOAD_KIND_UNSPECIFIED = 0;
  PUSH_PAYLOAD_KIND_ACK = 1;         // 消息确认
  PUSH_PAYLOAD_KIND_NOTIFICATION = 2; // 通知
  PUSH_PAYLOAD_KIND_CUSTOM = 3;      // 自定义数据
  PUSH_PAYLOAD_KIND_SYSTEM = 4;      // 系统消息
  PUSH_PAYLOAD_KIND_CAPABILITY = 5;  // Plugin realtime packet: online connections only, never stored or pushed offline
}

// 推送选项
message PushOptions {
  int32 priority = 1;                // 优先级（0-9，默认5）
  optional int64 expire_at = 2;       // 过期时间
  bool require_ack = 3;              // 是否需要客户端确认
  int32 retry_count = 4;             // 重试次数
  int32 retry_delay_ms = 5;          // 重试延迟（毫秒）
  map<string, string> attributes = 6; // 扩展字段
}

// ACK 载荷
message AckPayload {
  string message_id = 1;             // 消息ID
  string conversation_id = 2;        // 会话ID
  uint64 seq = 3;                    // 序列号
  string ack_type = 4;               // ACK类型（received、read、played）
  int64 ack_at = 5;                  // ACK时间
}

// 通知载荷
message NotificationPayload {
  string notification_id = 1;        // 通知ID
  string title = 2;                  // 标题
  string body = 3;                   // 内容
  string icon = 4;                   // 图标URL
  string sound = 5;                  // 提示音
  string click_action = 6;           // 点击动作
  map<string, string> attributes = 7; // 自定义数据
  int64 created_at = 8;              // 创建时间
}

// 自定义数据载荷
message CustomPayload {
  string custom_type = 1;            // 自定义类型
  bytes custom_data = 2;             // 自定义数据（二进制）
  map<string, string> attributes = 3; // 元数据
  int64 created_at = 4;              // 创建时间
}

// 系统消息载荷
message SystemPayload {
  string system_type = 1;            // 系统消息类型
  string title = 2;                  // 标题
  string content = 3;                // 内容
  map<string, string> attributes = 4; // 参数
  int64 created_at = 5;              // 创建时间
}

message PushEnvelope {
  string envelope_id = 1;            // 信封ID（唯一标识）
  string tenant_id = 2;              // 租户ID
  string trace_id = 3;               // 追踪ID
  int64 created_at = 4;              // 创建时间

  // 推送目标
  PushTargetType target_type = 5;    // 目标类型
  repeated string target_user_ids = 6;   // 目标用户ID列表
  repeated string target_device_ids = 7; // 目标设备ID列表

  // 推送载荷
  PushPayloadKind payload_kind = 8;  // 载荷类型
  PushOptions options = 9;           // 推送选项

  // 载荷内容（五选一）
  oneof payload {
    AckPayload ack = 10;             // ACK载荷
    NotificationPayload notification = 11; // 通知载荷
    CustomPayload custom = 12;       // 自定义载荷
    SystemPayload system = 13;       // 系统消息载荷
    CapabilityPacket capability = 15; // Plugin realtime packet, delivered as DataPacket.capability
  }

  // 元数据
  map<string, string> headers = 14;  // 头信息（用于上下文传播）
}

message PushDelivered {
  int64 pushed_at = 1;               // 推送时间
}

message PushFailed {
  ErrorDetail error = 1;             // 结构化错误
  int64 failed_at = 2;               // 失败时间
}

// 推送结果
message PushResult {
  string envelope_id = 1;            // 信封ID
  string device_id = 2;              // 设备ID
  string user_id = 3;                // 用户ID
  oneof result {
    PushDelivered delivered = 10;    // 推送成功
    PushFailed failed = 11;          // 推送失败
  }
}
