syntax = "proto3";

package flare.common.v1;

// 时间约定：所有 int64 时间点字段均为 Unix epoch milliseconds；duration/rtt/retry_delay 等时间量保留单位后缀。

// 核心上下文；优先走 gRPC metadata（x-trace-id / x-user-id / x-tenant-id 等）。
message CoreContext {
  string request_id = 1;
  string trace_id = 2;

  string user_id = 3;
  string tenant_id = 4;

  string device_id = 5;
  string platform = 6; // ios/android/web/pc
}

// 扩展上下文（按需，不进主链路）。
message ExtendedContext {
  map<string, string> attributes = 1;
}

/// 操作者类型（鉴权与审计）
enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  ACTOR_TYPE_USER = 1;
  ACTOR_TYPE_SERVICE = 2;
  ACTOR_TYPE_TENANT_ADMIN = 3;
  ACTOR_TYPE_SYSTEM = 4;
  ACTOR_TYPE_GUEST = 5;
}

/// 操作者上下文（RBAC roles、审计 actor）
message ActorContext {
  string actor_id = 1;
  ActorType type = 2;
  repeated string roles = 3;
  map<string, string> attributes = 4;
}


/// 推送专用设备上下文（仅 Push / 在线状态使用）
message DeviceContext {
  string device_id = 1;
  string platform = 2;
  DevicePriority priority = 3;
}

/// 审计上下文（敏感操作记录）
message AuditContext {
  ActorContext actor = 1;
  optional int64 operated_at = 2;
  string reason = 3;
  map<string, string> attributes = 4;
}

// 设备优先级（多端推送选端）。
enum DevicePriority {
  DEVICE_PRIORITY_UNSPECIFIED = 0;
  DEVICE_PRIORITY_LOW = 1;      /// 后台/离线
  DEVICE_PRIORITY_NORMAL = 2;
  DEVICE_PRIORITY_HIGH = 3;     /// 当前使用设备
  DEVICE_PRIORITY_CRITICAL = 4; /// 强制推送、忽略免打扰
}

// 设备应用状态。客户端经传输层 DEVICE_STATE 系统命令上报，服务端据此决定新消息的提示
// 由这条链路负责还是交给推送通道。
enum DeviceAppState {
  DEVICE_APP_STATE_UNSPECIFIED = 0;
  DEVICE_APP_STATE_ACTIVE = 1;   /// 前台：核心在应用内提示
  DEVICE_APP_STATE_STANDBY = 2;  /// 后台、链路保留、本进程能自己发系统通知：送达确认超时则转推送
  DEVICE_APP_STATE_PARKING = 3;  /// 即将被挂起：从服务端确认起，提示交给推送通道，客户端随后关闭链路
  /// 后台、链路保留、但本进程不能自己提示（手机还没有后台展示器）：消息照常经链路下发，
  /// 提示由推送通道负责，服务端在路由时直接推送，不等送达确认。
  DEVICE_APP_STATE_DEFERRED = 4;
}

// 用户注意力。别的设备处于 ACTIVE 且 ATTENTIVE 时，手机推送可以延迟并在已读后取消。
enum DeviceAttention {
  DEVICE_ATTENTION_UNSPECIFIED = 0;
  DEVICE_ATTENTION_ATTENTIVE = 1; /// 有输入焦点且近期有操作
  DEVICE_ATTENTION_IDLE = 2;      /// 窗口在前台但一段时间没有操作
}

/// DEVICE_STATE 系统命令的载荷（客户端 → 服务端）。
message DeviceStateReport {
  DeviceAppState state = 1;
  DeviceAttention attention = 2;
  uint32 badge = 3;        /// 设备当前的未读总数，作为服务端角标的基线
  int64 reported_at = 4;   /// 设备上报时间，Unix epoch millis；只用于诊断，服务端决策不依赖设备时钟
}

/// DEVICE_STATE_ACK 系统命令的载荷（服务端 → 客户端）。
/// 同一条连接上帧按写出顺序到达：客户端收到它时，服务端在此之前写出的帧都已到达。
/// state 为 PARKING 时，服务端此后不再向这条连接写需要提示的帧。
message DeviceStateAck {
  DeviceAppState state = 1;  /// 服务端已生效的状态
  int64 server_time = 2;     /// Unix epoch millis
}

/// 连接质量（跨机房/选端可选参考）
message ConnectionQuality {
  int64 rtt_ms = 1;
  double packet_loss_rate = 2;
  int64 last_measured_at = 3;
  string network_type = 4;   /// wifi/4g/5g
  int32 signal_strength = 5;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}

/// 排序（会话列表/消息列表排序）
message SortExpression {
  string field = 1;
  SortDirection direction = 2;
}

/// 过滤操作符（查询/搜索）
enum FilterOperator {
  FILTER_OPERATOR_UNSPECIFIED = 0;
  FILTER_OPERATOR_EQ = 1;
  FILTER_OPERATOR_NE = 2;
  FILTER_OPERATOR_IN = 3;
  FILTER_OPERATOR_NOT_IN = 4;
  FILTER_OPERATOR_GT = 5;
  FILTER_OPERATOR_GE = 6;
  FILTER_OPERATOR_LT = 7;
  FILTER_OPERATOR_LE = 8;
  FILTER_OPERATOR_CONTAINS = 9;
}

/// 过滤条件（多条件 AND）
message FilterExpression {
  string field = 1;
  FilterOperator op = 2;
  repeated string values = 3;
}

/// 时间范围（存储 §3.4 按 time range 查询）
message TimeRange {
  optional int64 start_time = 1;
  optional int64 end_time = 2;
}

/// 分页（cursor/limit/has_more；Sync、历史消息、会话列表通用）
message Pagination {
  string cursor = 1;
  int32 limit = 2;
  bool has_more = 3;
  string previous_cursor = 4;
  int64 total_size = 5;
}

/// 媒体附件（消息内引用；上传走 Media 服务）
message MediaAttachment {
  string file_id = 1;
  string file_name = 2;
  string mime_type = 3;
  int64 size = 4;
  string url = 5;
  string cdn_url = 6;
  int64 duration_ms = 7;
  string checksum = 8;
  map<string, string> attributes = 9;
}
